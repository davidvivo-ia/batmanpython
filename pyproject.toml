[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "batman-returns-py"
version = "1.0.0"
description = "A modern Python homage to Batman Returns (Sega CD, 1992) — beat-'em-up engine inspired by the original 68000 ASM source."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "batmanpython contributors" }]
keywords = ["batman", "pygame", "retro", "beat-em-up", "sega-cd"]
dependencies = [
    "pygame-ce>=2.5.1",
    "numpy>=1.26",
]

[project.scripts]
batman-returns = "batman_returns.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/batman_returns"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0915"]
