[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "batman-returns-py"
version = "1.0.0"
description = "A modern Python homage to Batman Returns (Sega CD, 1992) — beat-'em-up engine inspired by the original 68000 ASM source."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "batmanpython contributors" }]
keywords = ["batman", "pygame", "retro", "beat-em-up", "sega-cd"]
dependencies = [
    "pygame-ce>=2.5.1",
    "numpy>=1.26",
]

[project.scripts]
batman-returns = "batman_returns.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/batman_returns"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
# Game code routinely has many branches/returns and uses pygame's mutable
# event dispatch pattern; skip the more pedantic complexity rules.
ignore = [
    "PLR2004",  # magic numbers (game tunables)
    "PLR0913",  # too many args
    "PLR0915",  # too many statements
    "PLR0911",  # too many returns
    "PLR0912",  # too many branches
    "PLW0603",  # global statement (mixer channel singleton)
    "PLR1714",  # set-of-comparisons style
    "PLR1711",  # useless return (signals intent in event handlers)
    "PLR5501",  # elif vs else-if
    "PLC0415",  # late imports (avoid pygame import at module top in tests)
    "SIM102",   # nested if (often clearer)
    "SIM105",   # contextlib.suppress (overkill for one-liners)
    "E501",     # long lines (sprite grids and prompt strings)
]
